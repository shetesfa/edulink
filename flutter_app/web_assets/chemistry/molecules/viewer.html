<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EduLink — Molecule Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a1a;
    color: #fff;
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    background: linear-gradient(135deg, #1a1a3e, #2d1b69);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(124,58,237,0.3);
    flex-shrink: 0;
  }
  .header-icon { font-size: 24px; }
  .header-text h1 { font-size: 16px; font-weight: 700; color: #a78bfa; }
  .header-text p  { font-size: 11px; color: #6b7280; }

  /* ── Molecule selector ── */
  .mol-selector {
    background: #111127;
    padding: 10px 12px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    scrollbar-width: none;
  }
  .mol-selector::-webkit-scrollbar { display: none; }
  .mol-btn {
    flex-shrink: 0;
    background: rgba(124,58,237,0.12);
    border: 1.5px solid rgba(124,58,237,0.3);
    color: #c4b5fd;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .mol-btn:hover, .mol-btn.active {
    background: rgba(124,58,237,0.5);
    border-color: #7c3aed;
    color: #fff;
    transform: scale(1.05);
  }

  /* ── Viewer area ── */
  #viewer-wrap {
    flex: 1;
    position: relative;
    min-height: 0;
  }
  #mol-viewer {
    width: 100%;
    height: 100%;
    border: none;
  }
  .loading-overlay {
    position: absolute; inset: 0;
    background: #0a0a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid rgba(124,58,237,0.2);
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-overlay p { color: #a78bfa; font-size: 14px; }

  /* ── Info panel ── */
  .info-panel {
    background: #111127;
    border-top: 1px solid rgba(124,58,237,0.2);
    padding: 12px 16px;
    flex-shrink: 0;
  }
  .info-title { font-size: 15px; font-weight: 700; color: #a78bfa; margin-bottom: 6px; }
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .info-item {
    background: rgba(124,58,237,0.08);
    border: 1px solid rgba(124,58,237,0.15);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }
  .info-item .val { font-size: 15px; font-weight: 700; color: #c4b5fd; }
  .info-item .key { font-size: 10px; color: #6b7280; margin-top: 2px; }

  /* ── Style controls ── */
  .style-controls {
    display: flex;
    gap: 6px;
    padding: 8px 16px;
    background: #0d0d24;
    flex-shrink: 0;
    border-top: 1px solid rgba(255,255,255,0.04);
  }
  .style-btn {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: #9ca3af;
    padding: 7px 4px;
    border-radius: 10px;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .style-btn:hover, .style-btn.active {
    background: rgba(124,58,237,0.3);
    border-color: #7c3aed;
    color: #fff;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">⚗️</div>
  <div class="header-text">
    <h1>3D Molecule Viewer</h1>
    <p>Interactive chemical structure explorer</p>
  </div>
</div>

<div class="mol-selector" id="molSelector"></div>

<div id="viewer-wrap">
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p>Loading molecule...</p>
  </div>
  <div id="mol-viewer"></div>
</div>

<div class="style-controls">
  <div class="style-btn active" onclick="setStyle('stick')" id="btn-stick">🔗 Stick</div>
  <div class="style-btn" onclick="setStyle('sphere')" id="btn-sphere">⚪ Sphere</div>
  <div class="style-btn" onclick="setStyle('cartoon')" id="btn-cartoon">🎀 Ball+Stick</div>
  <div class="style-btn" onclick="setStyle('surface')" id="btn-surface">🫧 Surface</div>
</div>

<div class="info-panel">
  <div class="info-title" id="molName">Water (H₂O)</div>
  <div class="info-grid" id="infoGrid">
    <div class="info-item"><div class="val" id="infoFormula">H₂O</div><div class="key">Formula</div></div>
    <div class="info-item"><div class="val" id="infoAtoms">3</div><div class="key">Atoms</div></div>
    <div class="info-item"><div class="val" id="infoMass">18.015</div><div class="key">Mol. Weight</div></div>
  </div>
</div>

<script src="3Dmol-min.js"></script>
<script>
// ── Molecule database (SDF/XYZ format strings or PubChem CIDs)
const molecules = [
  { id: 'water',    name: 'Water',              formula: 'H₂O',      atoms: 3,   mass: '18.015',  cid: 962,    desc: 'Essential for life — polar molecule, bent shape' },
  { id: 'co2',      name: 'Carbon Dioxide',     formula: 'CO₂',      atoms: 3,   mass: '44.010',  cid: 280,    desc: 'Greenhouse gas — linear molecule' },
  { id: 'o2',       name: 'Oxygen Gas',         formula: 'O₂',       atoms: 2,   mass: '32.000',  cid: 977,    desc: 'Diatomic — essential for respiration' },
  { id: 'nacl',     name: 'Sodium Chloride',    formula: 'NaCl',     atoms: 2,   mass: '58.440',  cid: 5234,   desc: 'Table salt — ionic bond' },
  { id: 'hcl',      name: 'Hydrochloric Acid',  formula: 'HCl',      atoms: 2,   mass: '36.461',  cid: 313,    desc: 'Strong acid — used in labs' },
  { id: 'glucose',  name: 'Glucose',            formula: 'C₆H₁₂O₆', atoms: 24,  mass: '180.156', cid: 5793,   desc: 'Simple sugar — energy source for cells' },
  { id: 'methane',  name: 'Methane',            formula: 'CH₄',      atoms: 5,   mass: '16.043',  cid: 297,    desc: 'Natural gas — tetrahedral shape' },
  { id: 'ammonia',  name: 'Ammonia',            formula: 'NH₃',      atoms: 4,   mass: '17.031',  cid: 222,    desc: 'Fertiliser base — pyramidal shape' },
  { id: 'h2so4',    name: 'Sulphuric Acid',     formula: 'H₂SO₄',   atoms: 7,   mass: '98.079',  cid: 1118,   desc: 'Strong acid — used in batteries' },
  { id: 'caco3',    name: 'Calcium Carbonate',  formula: 'CaCO₃',   atoms: 5,   mass: '100.087', cid: 10112,  desc: 'Limestone — found in shells & rocks' },
  { id: 'ethanol',  name: 'Ethanol',            formula: 'C₂H₅OH',  atoms: 9,   mass: '46.068',  cid: 702,    desc: 'Alcohol — disinfectant & fuel' },
  { id: 'naoh',     name: 'Sodium Hydroxide',   formula: 'NaOH',    atoms: 3,   mass: '39.997',  cid: 14798,  desc: 'Caustic soda — strong base' },
];

let viewer = null;
let currentMol = molecules[0];
let currentStyle = 'stick';

// Build selector buttons
const selector = document.getElementById('molSelector');
molecules.forEach((mol, i) => {
  const btn = document.createElement('div');
  btn.className = 'mol-btn' + (i === 0 ? ' active' : '');
  btn.textContent = mol.formula;
  btn.title = mol.name;
  btn.onclick = () => loadMolecule(mol, btn);
  selector.appendChild(btn);
});

function showLoading(show) {
  document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
}

function updateInfo(mol) {
  document.getElementById('molName').textContent = mol.name + ' (' + mol.formula + ')';
  document.getElementById('infoFormula').textContent = mol.formula;
  document.getElementById('infoAtoms').textContent = mol.atoms;
  document.getElementById('infoMass').textContent = mol.mass;
}

function setStyle(style) {
  currentStyle = style;
  document.querySelectorAll('.style-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + (style === 'cartoon' ? 'cartoon' : style)).classList.add('active');
  if (!viewer) return;
  viewer.setStyle({}, getStyleObj(style));
  viewer.render();
}

function getStyleObj(style) {
  switch(style) {
    case 'stick':   return { stick: { colorscheme: 'Jmol', radius: 0.15 } };
    case 'sphere':  return { sphere: { colorscheme: 'Jmol', scale: 0.35 } };
    case 'cartoon': return { stick: { colorscheme: 'Jmol', radius: 0.12 }, sphere: { colorscheme: 'Jmol', scale: 0.3 } };
    case 'surface': return { stick: { colorscheme: 'Jmol', radius: 0.12 } };
    default:        return { stick: { colorscheme: 'Jmol' } };
  }
}

function loadMolecule(mol, clickedBtn) {
  // Update active button
  document.querySelectorAll('.mol-btn').forEach(b => b.classList.remove('active'));
  if (clickedBtn) clickedBtn.classList.add('active');
  currentMol = mol;
  updateInfo(mol);
  showLoading(true);

  // Fetch SDF from PubChem (works offline if already cached, or on local network)
  const url = `https://pubchem.ncbi.nlm.nih.gov/rest/pug/compound/cid/${mol.cid}/SDF?record_type=3d`;

  fetch(url)
    .then(r => r.text())
    .then(sdf => {
      if (!viewer) {
        viewer = $3Dmol.createViewer(document.getElementById('mol-viewer'), {
          backgroundColor: '0a0a1a',
          antialias: true,
        });
      }
      viewer.clear();
      viewer.addModel(sdf, 'sdf');
      viewer.setStyle({}, getStyleObj(currentStyle));
      if (currentStyle === 'surface') {
        viewer.addSurface($3Dmol.SurfaceType.VDW, {
          opacity: 0.7,
          colorscheme: 'Jmol'
        });
      }
      viewer.zoomTo();
      viewer.spin(true);
      viewer.render();
      showLoading(false);
    })
    .catch(() => {
      // Fallback: use embedded XYZ data for offline mode
      loadOfflineFallback(mol);
    });
}

function loadOfflineFallback(mol) {
  // Simple offline XYZ data for common molecules
  const offlineData = {
    962:  `3\nWater\nO  0.000  0.000  0.119\nH  0.000  0.757 -0.476\nH  0.000 -0.757 -0.476`,
    280:  `3\nCarbon Dioxide\nC  0.000  0.000  0.000\nO  1.160  0.000  0.000\nO -1.160  0.000  0.000`,
    297:  `5\nMethane\nC  0.000  0.000  0.000\nH  0.629  0.629  0.629\nH -0.629 -0.629  0.629\nH -0.629  0.629 -0.629\nH  0.629 -0.629 -0.629`,
    222:  `4\nAmmonia\nN  0.000  0.000  0.000\nH  0.000  0.942  0.000\nH  0.816 -0.471  0.000\nH -0.816 -0.471  0.000`,
    977:  `2\nOxygen\nO  0.000  0.000  0.000\nO  1.208  0.000  0.000`,
  };
  const xyz = offlineData[mol.cid];
  if (!viewer) {
    viewer = $3Dmol.createViewer(document.getElementById('mol-viewer'), {
      backgroundColor: '0a0a1a', antialias: true,
    });
  }
  viewer.clear();
  if (xyz) {
    viewer.addModel(xyz, 'xyz');
  } else {
    // Show placeholder text
    viewer.clear();
    showLoading(false);
    document.getElementById('molName').textContent = mol.name + ' — Connect internet for 3D model';
    return;
  }
  viewer.setStyle({}, getStyleObj(currentStyle));
  viewer.zoomTo();
  viewer.spin(true);
  viewer.render();
  showLoading(false);
}

// Load first molecule on startup
window.addEventListener('load', () => {
  loadMolecule(molecules[0], selector.children[0]);
});
</script>
</body>
</html>
